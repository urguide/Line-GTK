name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]
  # Build and retain artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test automatic versioning
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Prepare automatic release version
        id: version
        run: python3 scripts/prepare-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source.bundle
          retention-days: 14
          if-no-files-found: error

  build:
    name: Build Linux ${{ matrix.arch }}
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      DENO_FROZEN_LOCKFILE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Check out exact release sources
        env:
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          git fetch "$RUNNER_TEMP/release-source/release-source.bundle" "refs/tags/$TAG"
          git checkout --detach "$COMMIT"
      - name: Check native architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          echo "LINE_GTK_DIST_DIR=$RUNNER_TEMP/line-gtk-dist" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: Swatinem/rust-cache@v2
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev ffmpeg appstream flatpak flatpak-builder ostree
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
      - name: Check protocol
        working-directory: protocol
        run: deno task check
      - name: Validate Flatpak metadata
        run: appstreamcli validate --no-net packaging/flatpak/dev.linegtk.LineGtk.metainfo.xml
      - name: Build and check release assets
        run: ./packaging/make-release-assets.sh
      - name: Verify checksums
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cd "$LINE_GTK_DIST_DIR"
          sha256sum --check "SHA256SUMS-$ARCH"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/line-gtk-dist/*.tar.gz
            ${{ runner.temp }}/line-gtk-dist/*.flatpak
            ${{ runner.temp }}/line-gtk-dist/SHA256SUMS-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-source
          path: ${{ runner.temp }}/release-source
      - name: Import verified release commit
        env:
          TAG: ${{ needs.version.outputs.tag }}
          COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          git fetch "$RUNNER_TEMP/release-source/release-source.bundle" "refs/tags/$TAG:refs/tags/$TAG"
          test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$COMMIT"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*64
          merge-multiple: true
          path: dist
      - name: Verify all assets and combine checksums
        working-directory: dist
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for arch in x86_64 aarch64; do
            test -s "line-gtk-$VERSION-$arch.tar.gz"
            test -s "line-gtk-$VERSION-$arch.flatpak"
            test "$(wc -l < "SHA256SUMS-$arch")" -eq 2
            sha256sum --check "SHA256SUMS-$arch"
          done
          cat SHA256SUMS-x86_64 SHA256SUMS-aarch64 > SHA256SUMS
      - name: Publish release assets
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Publish only after both architectures pass. The tag points to the
          # exact versioned source commit used by both builders.
          git push origin "refs/tags/$TAG"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then
            prerelease+=(--prerelease)
          fi
          if gh release view "$TAG" --json isDraft --jq .isDraft > release-draft.txt; then
            if [[ "$(cat release-draft.txt)" != true ]]; then
              echo "$TAG is already published; leaving its assets intact."
              exit 0
            fi
          else
            gh release create "$TAG" --draft \
              --verify-tag --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$TAG" --clobber ./*.tar.gz ./*.flatpak SHA256SUMS
          gh release edit "$TAG" --draft=false "${prerelease[@]}"
